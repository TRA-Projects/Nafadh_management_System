<h2 class="nfd-page-title">التخصصات المعتمدة وخطط التدريب</h2>
<p class="nfd-page-sub">البرامج التي تستضيفها الشركة وفق اعتماد الهيئة</p>

<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">
  @for (p of programs(); track $index) {
    <div class="nfd-card" style="display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--color-tint-indigo);display:flex;align-items:center;justify-content:center;font-size:20px">📗</div>
      <div><strong>برنامج معتمد #{{ $index + 1 }}</strong><p class="nfd-muted" style="margin:2px 0 0">{{ p | json }}</p></div>
    </div>
  }
  @empty { <p class="nfd-muted">لا توجد برامج معتمدة بعد</p> }
</div>
