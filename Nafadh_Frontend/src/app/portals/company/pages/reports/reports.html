<div class="reports-page">
    <header class="reports-header">
        <div class="header-right">
            <h1>التقارير والإحصائيات</h1>
            <p class="description">استعراض شامل لبيانات الحضور والإنجاز والطاقة الاستيعابية</p>

            <div class="tabs">
                <button class="tab" [class.active]="tab() === 'attendance'" (click)="selectTab('attendance')">
                    تقارير الحضور
                </button>
                <button class="tab" [class.active]="tab() === 'achievement'" (click)="selectTab('achievement')">
                    نسبة الإنجاز
                </button>
                <button class="tab" [class.active]="tab() === 'capacity'" (click)="selectTab('capacity')">
                    الطاقة الاستيعابية
                </button>
            </div>
        </div>

        <div class="header-left">
            <div class="export-group">
                <button class="export-btn" (click)="exportPdf()">تصدير PDF</button>
                <button class="export-btn excel" (click)="exportExcel()">تصدير Excel</button>
            </div>
        </div>
    </header>

    @if (loading()) {
    <div class="loading-card">جاري تحميل البيانات...</div>
    }

    @if (errorMessage()) {
    <div class="error-card">{{ errorMessage() }}</div>
    }
<!-- =========================
       1 - ATTENDANCE TAB
  ========================== -->
    @if (tab() === 'attendance') {
    @if (attendance(); as att) {
    <div class="summary">
        <div class="summary-card">
            <div class="card-title">إجمالي المتدربين</div>
            <div class="card-value blue">{{ $any(att).totalTrainees }}</div>
            <div class="card-sub">متدرب نشط في الشركة</div>
        </div>

    }}
