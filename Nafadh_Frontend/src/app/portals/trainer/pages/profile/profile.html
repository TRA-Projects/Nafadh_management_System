<h2 class="nfd-page-title">الملف الشخصي والإعدادات</h2>
<p class="nfd-page-sub">إدارة بيانات المدرب والتخصص المهني وتفضيلات الحساب</p>

@if (trainer(); as t) {
  <div class="nfd-card profile-card">
    
    <!-- Header -->
    <div class="profile-header">
      <div class="trainer-info">
        <div class="trainer-avatar">
          <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.31 0-6 2.24-6 5v1h12v-1c0-2.76-2.69-5-6-5Z"/>
          </svg>
        </div>
        <div>
          <strong class="trainer-name">{{ t.fullName || 'فاطمة المدربة' }}</strong>
          <span class="trainer-role">مدربة · نفاذ</span>
        </div>
      </div>

      <button 
        class="nfd-btn primary" 
        [disabled]="isSaving()" 
        (click)="save()">
        {{ isSaving() ? 'جاري الحفظ...' : 'حفظ التغيرات' }}
      </button>
    </div>

    <!-- Notification Toast -->
    @if (showToast()) {
      <div class="nfd-toast-msg">
        ✓ تم حفظ التغيرات بنجاح
      </div>
    }

    <!-- Form -->
    <div class="profile-form">
      <div class="form-row">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input 
            class="nfd-input" 
            type="text" 
            [(ngModel)]="t.fullName" 
            placeholder="أدخل الاسم الكامل" />
        </div>

        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input 
            class="nfd-input" 
            type="email" 
            [(ngModel)]="t.email" 
            placeholder="example@domain.com" />
        </div>
      </div>

      <div class="form-group">
        <label>التخصص التدريبي</label>
        <input 
          class="nfd-input" 
          type="text" 
          [(ngModel)]="t.specialty" 
          placeholder="أدخل التخصص التدريبي" />
      </div>

      <div class="form-group">
        <label>نبذة مهنية</label>
        <textarea 
          class="nfd-input" 
          rows="4" 
          [(ngModel)]="t.biography" 
          placeholder="اكتب نبذة مهنية مختصرة...">
        </textarea>
      </div>
    </div>

  </div>
}
