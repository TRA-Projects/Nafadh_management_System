<section class="user-manual-host" aria-label="دليل استخدام بوابة المتدرب">
  <button
    type="button"
    class="manual-help-button"
    (click)="toggleHelp()"
    [attr.aria-expanded]="guideService.isHelpOpen()"
  >
    <span aria-hidden="true">?</span>
    <span>دليل الاستخدام</span>
  </button>

  <!-- =========================================================
       HELP PANEL (المكوّن الجديد)
       ========================================================= -->
  <app-help-panel
    [isOpen]="guideService.isHelpOpen()"
    [pageKey]="guideService.currentPageKey()"
    (close)="closeHelp()"
  />
</section>
