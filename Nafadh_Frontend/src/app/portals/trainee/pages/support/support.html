<div style="max-width: 800px; margin: 30px auto; padding: 20px;">
  <h2 class="nfd-page-title" style="text-align: right;">الدعم والشكاوي</h2>
  <p class="nfd-page-sub" style="text-align: right; margin-bottom: 24px;">أرسل استفسارك أو شكواك مباشرة للجهة المختصة</p>

  <div class="nfd-card" style="padding: 24px; text-align: right; direction: rtl;">
    <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px; font-weight: bold;">تقديم استفسار أو شكوى :</h3>

    <div style="margin-bottom: 14px;">
      <label style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--color-text-secondary);">الجهة المستلمة</label>
      <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 12px; background: var(--color-tint-indigo, #eef2ff);">
        <span style="font-size: 14px; color: var(--color-text-main);">هيئة تنظيم الاتصالات</span>
      </div>
    </div>

    <!-- إبعاد السهم عن الحافة اليسرى بمسافة مريحة ودقيقة -->
    <div style="margin-bottom: 14px;">
      <label style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--color-text-secondary);">الموضوع</label>
      <select [(ngModel)]="newConv.subject" style="width: 100%; text-align: right; direction: rtl; padding: 10px 14px; padding-left: 36px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-background-input, #fff); color: var(--color-text-main, #333); font-size: 14px; outline: none;">
        <option value="" disabled selected>اختر موضوع الطلب</option>
        @for (s of subjects; track s) { <option [value]="s">{{ s }}</option> }
      </select>
    </div>

    <div style="margin-bottom: 14px;">
      <label style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--color-text-secondary);">تفاصيل الطلب</label>
      <textarea class="nfd-input" rows="4" [(ngModel)]="newConv.firstMessage" placeholder="اكتب تفاصيل استفسارك أو شكواك هنا..." style="width: 100%; text-align: right; resize: none; padding: 10px; min-height: 90px; max-height: 150px;"></textarea>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 6px; font-size: 13px; color: var(--color-text-secondary);">إرفاق ملفات داعمة</label>
      
      <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)" accept=".pdf,.png,.jpg,.jpeg" />

      <div (click)="fileInput.click()" style="border: 2px dashed var(--color-border); border-radius: 10px; padding: 16px; text-align: center; background: var(--color-background-subtle, #fafafa); cursor: pointer; outline: none;">
        
        <div style="width: 44px; height: 44px; background: var(--color-tint-indigo, #eef2ff); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; color: var(--color-navy, #1e1b4b);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        </div>

        <p style="margin: 0 0 4px; font-size: 12px; color: var(--color-text-main);">اسحب وأفلت المستندات والصور هنا، أو</p>
        <span style="font-size: 12px; color: #0066cc; font-weight: 600; display: inline-block;">انقر للاختيار (اختياري)</span>
        <p style="margin: 4px 0 0; font-size: 10px; color: var(--color-text-tertiary);">PDF, PNG, JPG — Max 10MB</p>
      </div>
    </div>

    <div>
      <button class="nfd-btn primary" (click)="startConversation()" style="width: 100%; padding: 10px; font-size: 14px; justify-content: center;">إرسال الطلب</button>
    </div>
  </div>
</div>
