<h2 class="nfd-page-title">الملف الشخصي</h2>

@if (trainee(); as t) {
  <div class="nfd-card" style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
    <div style="width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--color-navy),var(--color-cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700">{{ t.fullName?.charAt(0) }}</div>
    <div style="flex:1"><strong style="display:block;font-size:16px">{{ t.fullName }}</strong><p class="nfd-muted" style="margin:2px 0 0">{{ t.major }}</p></div>
    <button class="nfd-btn" [class.primary]="!editing()" [class.secondary]="editing()" (click)="toggleEdit()">
      {{ editing() ? 'حفظ التعديلات' : 'تعديل الملف' }}
    </button>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="nfd-card">
      <h3>البيانات الشخصية</h3>
      <label style="display:block;font-size:12px;font-weight:600;margin:10px 0 4px">الجامعة</label>
      <input class="nfd-input" [(ngModel)]="t.university" [readonly]="!editing()" />
      <label style="display:block;font-size:12px;font-weight:600;margin:10px 0 4px">التخصص</label>
      <input class="nfd-input" [(ngModel)]="t.major" [readonly]="!editing()" />
      <label style="display:block;font-size:12px;font-weight:600;margin:10px 0 4px">المهارات</label>
      <input class="nfd-input" [(ngModel)]="t.skills" [readonly]="!editing()" />
    </div>
    <div class="nfd-card">
      <h3>حسابات التواصل المهني</h3>
      <label style="display:block;font-size:12px;font-weight:600;margin:10px 0 4px">GitHub</label>
      <input class="nfd-input" [(ngModel)]="t.gitHubUrl" [readonly]="!editing()" dir="ltr" />
      <label style="display:block;font-size:12px;font-weight:600;margin:10px 0 4px">LinkedIn</label>
      <input class="nfd-input" [(ngModel)]="t.linkedInUrl" [readonly]="!editing()" dir="ltr" />
    </div>
  </div>
}
