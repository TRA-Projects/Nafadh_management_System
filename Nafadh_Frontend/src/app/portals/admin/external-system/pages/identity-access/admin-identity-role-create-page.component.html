<div class="rounded-xl border border-[#ebedf2] bg-white p-3 shadow-sm dark:border-[#191e3a] dark:bg-[#0e1726] sm:p-4 md:p-6">
  <div class="flex flex-wrap items-center gap-3">
    <app-back-arrow-button
      class="shrink-0"
      [to]="backToList"
      [iconOnly]="true"
      [ariaLabel]="backToListAria"
    />
    <h2 class="min-w-0 text-xl font-bold text-black dark:text-white-light sm:text-2xl" i18n="@@jobseeker.identityAccess.createRole">
      Create role
    </h2>
  </div>

  @if (loadError()) {
    <div class="mt-4 rounded border border-danger/40 bg-danger/10 px-3 py-2 text-danger">{{ loadError() }}</div>
  }

  @if (loadState() === 'ready') {
    <form class="mt-4 max-w-xl space-y-4" [formGroup]="form" (ngSubmit)="save()">
      <div>
        <label class="mb-1 block text-sm" for="ia-role-create-name">
          <span i18n="@@jobseeker.identityAccess.colRole">Role</span>
          @if (form.controls.name.hasValidator(requiredValidator)) {
            <span class="text-danger"> *</span>
          }
        </label>
        <input id="ia-role-create-name" class="form-input w-full" type="text" formControlName="name" />
        @if (form.controls.name.touched) {
          <div class="mt-1 text-sm text-danger">{{ form.controls.name | validationMessage }}</div>
        }
      </div>
      <div>
        <label class="mb-1 block text-sm" for="ia-role-create-parent">
          <span i18n="@@jobseeker.identityAccess.parentRole">Parent role</span>
          @if (form.controls.parentRoleId.hasValidator(requiredValidator)) {
            <span class="text-danger"> *</span>
          }
        </label>
        <select id="ia-role-create-parent" class="form-select w-full" formControlName="parentRoleId">
          <option value=""></option>
          @for (role of templateRoles(); track role.Id) {
            <option [value]="role.Id">{{ templateLabel(role) }}</option>
          }
        </select>
        @if (form.controls.parentRoleId.touched) {
          <div class="mt-1 text-sm text-danger">{{ form.controls.parentRoleId | validationMessage }}</div>
        }
      </div>
      <div class="flex flex-wrap justify-start gap-2 rtl:flex-row-reverse">
        <button type="submit" class="btn btn-primary" i18n="@@jobseeker.common.save">Save</button>
        <button type="button" class="btn btn-outline-primary" (click)="cancel()" i18n="@@jobseeker.common.cancel">Cancel</button>
      </div>
    </form>
  }
</div>
