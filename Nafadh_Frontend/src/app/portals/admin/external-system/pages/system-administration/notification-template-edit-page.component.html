
<div class="template-edit-container" dir="rtl">
  <div class="page-head">
    <div class="breadcrumb">
      <a>الرئيسية</a>
      <i>/</i>
      <a>الإدارة</a>
      <i>/</i>
      <span>قوالب الإشعارات</span>
    </div>

    <div class="title-row">
      <button
        type="button"
        (click)="goBack()"
        class="back-arrow-btn"
        aria-label="رجوع"
      >
        <svg
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </button>

      <h1 class="page-title">{{ templateName }}</h1>
    </div>
  </div>

  <div class="main-card">
    <div class="card-banner">
      <div class="banner-icon">
        <svg
          width="26"
          height="26"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <rect
            x="4"
            y="4"
            width="16"
            height="13"
            rx="2"
            stroke-width="1.8"
          ></rect>

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M8 9h8M8 13h5M9 21l3-4"
          ></path>
        </svg>
      </div>

      <span class="banner-title">قالب البريد الإلكتروني</span>
    </div>

    <div class="card-body">
      @if (isLoading) {
        <div class="state-container" role="status">
          جارٍ تحميل بيانات القالب...
        </div>
      } @else {
        @if (errorMessage) {
          <div class="form-message error-state" role="alert">
            {{ errorMessage }}
          </div>
        }

        @if (successMessage) {
          <div class="form-message success-state" role="status">
            {{ successMessage }}
          </div>
        }

        <form [formGroup]="editForm" (ngSubmit)="save()">

          <!-- رمز القالب -->
          <div class="form-group">
            <label class="form-label" for="templateCode">
              رمز القالب <span class="req">*</span>
            </label>

            <input
              id="templateCode"
              type="text"
              formControlName="code"
              class="form-control"
              [class.readonly]="!isCreateMode"
              [readonly]="!isCreateMode"
              dir="ltr"
            />
          </div>

          <!-- اسم القالب والبوابة -->
          <div class="names-row">
            <div class="form-group">
              <label class="form-label" for="templateName">
                اسم القالب <span class="req">*</span>
              </label>

              <input
                id="templateName"
                type="text"
                formControlName="name"
                class="form-control"
                placeholder="أدخلي اسم القالب"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="portalCode">
                البوابة <span class="req">*</span>
              </label>

              <select
                id="portalCode"
                formControlName="portalCode"
                class="form-control"
              >
                <option value="" disabled>
                  اختاري البوابة
                </option>

                @for (portal of portalOptions; track portal.value) {
                  <option [value]="portal.value">
                    {{ portal.label }}
                  </option>
                }
              </select>
            </div>
          </div>

          <!-- نوع الإشعار -->
          <div class="form-group type-field">
            <label class="form-label" for="templateType">
              نوع الإشعار
            </label>

            <input
              id="templateType"
              type="text"
              value="البريد الإلكتروني (Email)"
              readonly
              class="form-control readonly"
            />

            <small class="field-hint">
              نوع القالب ثابت حسب إعدادات الـ Backend.
            </small>
          </div>

          <hr class="divider" />

          <!-- محتوى البريد الإلكتروني -->
          <section
            class="email-content"
            aria-label="محتوى البريد الإلكتروني"
          >
            <h2 class="section-title">
              محتوى البريد الإلكتروني
            </h2>

            <div class="form-group">
              <label class="form-label" for="emailSubject">
                الموضوع <span class="req">*</span>
              </label>

              <input
                id="emailSubject"
                type="text"
                formControlName="subject"
                class="form-control"
                placeholder="أدخلي موضوع البريد الإلكتروني"
              />
            </div>

            <div class="form-group body-field">
              <label class="form-label" for="emailBody">
                محتوى الرسالة <span class="req">*</span>
              </label>

              <textarea
                id="emailBody"
                formControlName="body"
                class="form-control body-control"
                rows="9"
                placeholder="اكتبي محتوى البريد الإلكتروني هنا..."
              ></textarea>
            </div>
          </section>

          <hr class="divider" />

          <!-- حالة القالب -->
          <div class="status-block">
            <label class="form-label">حالة القالب</label>

            <label class="checkbox-label">
              <input
                type="checkbox"
                formControlName="isActive"
                class="custom-checkbox"
              />
              <span>القالب نشط</span>
            </label>
          </div>

          <!-- أزرار الإجراءات -->
          <div class="actions">
            <button
              type="button"
              (click)="goBack()"
              class="btn-secondary"
            >
              إلغاء
            </button>

            <button
              type="submit"
              class="btn-primary"
              [disabled]="isSaving"
            >
              {{ isSaving ? 'جارٍ الحفظ...' : 'حفظ' }}
            </button>
          </div>

        </form>
      }
    </div>
  </div>
</div>
