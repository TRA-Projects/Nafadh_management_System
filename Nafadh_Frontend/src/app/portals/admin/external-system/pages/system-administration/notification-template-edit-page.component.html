<div class="template-edit-container" dir="rtl">

  <!-- Breadcrumb & Header -->
  <div class="page-head">
    <div class="breadcrumb">
      <a>الرئيسية</a><i>/</i><a>الإدارة</a><i>/</i><span>قالب إشعار</span>
    </div>
    <div class="title-row">
      <h1 class="page-title">{{ templateName || 'دعوة للتقديم' }}</h1>
      <button type="button" (click)="goBack()" class="back-arrow-btn" aria-label="رجوع">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Card -->
  <div class="main-card">
    <!-- Card Banner -->
    <div class="card-banner">
      <div class="banner-icon">
        <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="13" rx="2" stroke-width="1.8"></rect>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 9h8M8 13h5M9 21l3-4"></path>
        </svg>
      </div>
      <span class="banner-title">قوالب الإشعارات</span>
    </div>

    <div class="card-body">
      <!-- Tabs -->
      <div class="tabs-header">
        <button type="button" class="tab-item" [class.active]="activeTab === 'main'" (click)="activeTab = 'main'">
          التفاصيل الرئيسية
        </button>
        <button type="button" class="tab-item" [class.active]="activeTab === 'ar'" (click)="activeTab = 'ar'">
          العربية
        </button>
        <button type="button" class="tab-item" [class.active]="activeTab === 'en'" (click)="activeTab = 'en'">
          الإنجليزية
        </button>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="save()">

        <div *ngIf="activeTab === 'main'">
          <!-- Action Code -->
          <div class="form-group">
            <label class="form-label">رمز الإجراء</label>
            <input type="text" formControlName="code" readonly class="form-control readonly" />
          </div>

          <!-- Names: English (right) / Arabic (left) -->
          <div class="names-row">
            <div class="form-group">
              <label class="form-label">التسمية (إنجليزي)<span class="req">*</span></label>
              <input type="text" formControlName="nameEn" class="form-control" />
            </div>
            <div class="form-group">
              <label class="form-label">التسمية (عربي)<span class="req">*</span></label>
              <input type="text" formControlName="nameAr" class="form-control" />
            </div>
          </div>

          <hr class="divider" />

          <!-- Status -->
          <div class="status-block">
            <label class="form-label">الحالة</label>
            <div class="checks">
              <label class="checkbox-label">
                <input type="checkbox" formControlName="isActive" class="custom-checkbox" />
                <span>نشط</span><span class="req">*</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" formControlName="hasEmail" class="custom-checkbox" />
                <span>تفعيل البريد</span><span class="req">*</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" formControlName="hasSms" class="custom-checkbox" />
                <span>تفعيل الرسائل النصية</span><span class="req">*</span>
              </label>
            </div>
          </div>
        </div>

        <div *ngIf="activeTab === 'ar'" class="tab-placeholder"></div>
        <div *ngIf="activeTab === 'en'" class="tab-placeholder"></div>

        <hr class="divider" />

        <!-- Actions -->
        <div class="actions">
          <button type="button" (click)="preview()" class="btn-secondary">معاينة</button>
          <button type="submit" class="btn-primary">حفظ</button>
        </div>
      </form>
    </div>
  </div>
</div>
