<button
  type="button"
  class="btn btn-outline-primary btn-sm flex items-center border-0 bg-white-light/40 hover:bg-white-light/90 hover:text-primary dark:bg-dark/40 dark:hover:bg-dark/60"
  [class.gap-2]="!iconOnly()"
  [class.justify-center]="iconOnly()"
  [class.p-2]="iconOnly()"
  [class.min-h-9]="iconOnly()"
  [class.min-w-9]="iconOnly()"
  (click)="go()"
  [attr.aria-label]="label()"
>
  <svg
    class="h-4 w-4 shrink-0 rtl:rotate-180"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  @if (!iconOnly()) {
    <span class="text-sm font-semibold">{{ label() }}</span>
  }
</button>
