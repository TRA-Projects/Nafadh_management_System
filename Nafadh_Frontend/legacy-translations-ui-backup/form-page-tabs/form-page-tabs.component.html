<nav class="irf-tabs-nav" [class.irf-tabs-nav--compact]="compact()" aria-label="Tabs">
  <!-- Mobile / tablet: 3-tab window + arrows -->
  <div class="irf-tabs-carousel">
    <button
      type="button"
      class="irf-tabs-carousel__arrow"
      [disabled]="!showMobileArrows() || !canStepPrev()"
      (click)="step(-1)"
      [attr.aria-label]="prevTabAria"
      [attr.title]="prevTabAria"
    >
      <svg viewBox="0 0 24 24" class="irf-tabs-carousel__arrow-icon rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18 9 12l6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <ul
      class="irf-tabs-carousel__track"
      [style.grid-template-columns]="'repeat(' + visibleTabs().length + ', minmax(0, 1fr))'"
    >
      @for (tab of visibleTabs(); track tab.id) {
        <li class="irf-tabs-carousel__item" [class.irf-tabs-carousel__item--center]="isCenterVisible(tab.id)">
          <button
            type="button"
            class="irf-tabs__btn irf-tabs-carousel__btn"
            [class.irf-tabs__btn--active]="activeId() === tab.id"
            [attr.aria-disabled]="tab.disabled ? 'true' : null"
            [attr.aria-current]="activeId() === tab.id ? 'page' : null"
            (click)="selectTab(tab)"
          >
            <ng-container *ngTemplateOutlet="tabInner; context: { $implicit: tab }" />
          </button>
        </li>
      }
    </ul>

    <button
      type="button"
      class="irf-tabs-carousel__arrow"
      [disabled]="!showMobileArrows() || !canStepNext()"
      (click)="step(1)"
      [attr.aria-label]="nextTabAria"
      [attr.title]="nextTabAria"
    >
      <svg viewBox="0 0 24 24" class="irf-tabs-carousel__arrow-icon rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <!-- Desktop: full tab strip -->
  <ul class="irf-tabs irf-tabs--desktop">
    @for (tab of tabs(); track tab.id) {
      <li>
        <button
          type="button"
          class="irf-tabs__btn"
          [class.irf-tabs__btn--active]="activeId() === tab.id"
          [attr.aria-disabled]="tab.disabled ? 'true' : null"
          [attr.aria-current]="activeId() === tab.id ? 'page' : null"
          (click)="selectTab(tab)"
        >
          <ng-container *ngTemplateOutlet="tabInner; context: { $implicit: tab }" />
        </button>
      </li>
    }
  </ul>
</nav>

<ng-template #tabInner let-tab>
  @if (tab.iconSrc) {
    <span
      class="irf-tabs__icon"
      [style.--irf-tab-icon]="iconMaskUrl(tab.iconSrc)"
      aria-hidden="true"
    ></span>
  }
  <span class="irf-tabs__label">{{ tab.label }}</span>
</ng-template>
